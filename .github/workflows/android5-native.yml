name: WebHomeTV Android 5.0 - Full Native Rebuild

# Rebuilds MPV and EXO-ASS native stacks at API 21, then assembles leanback
# release APKs. IJK / sherpa-onnx / libc++ shared libraries are already API 21
# upstream and are intentionally left untouched. Debug signing fallback is used.

on:
  push:
    paths:
      - "webhtv-android5.0.patch"
      - "chaquopy-disable.patch"
      - ".github/workflows/android5-native.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  SOURCE_REPO: https://github.com/Silent1566/webhtv.git
  SOURCE_COMMIT: 3f469e2fe51716c2068a13b9d48f61de34a89e0d

jobs:
  prepare:
    name: Rebuild native libraries at API 21
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      artifact: native-api21
    steps:
      - name: Checkout build recipes
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install host build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            ninja-build pkg-config gperf perl cmake make \
            autoconf automake libtool bison flex gettext \
            texinfo yasm nasm zip unzip
          python3 -m pip install --quiet meson==1.11.2 ninja==1.11.1.1

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platforms and NDKs
        run: |
          sdkmanager "platform-tools" "platforms;android-28" "build-tools;36.0.0" \
            "ndk;29.0.14206865" "ndk;28.2.13676358"
          curl -fsSL -o /tmp/platform-37.zip https://dl.google.com/android/repository/platform-37.0_r01.zip
          rm -rf /tmp/platform-37 "$ANDROID_HOME/platforms/android-37"
          mkdir -p /tmp/platform-37 "$ANDROID_HOME/platforms"
          unzip -q /tmp/platform-37.zip -d /tmp/platform-37
          platform_jar="$(find /tmp/platform-37 -name android.jar -print -quit)"
          test -n "$platform_jar"
          mv "$(dirname "$platform_jar")" "$ANDROID_HOME/platforms/android-37"

      - name: Clone upstream source and apply Android 5.0 patch
        run: |
          set -euo pipefail
          git clone "$SOURCE_REPO" webhtv
          cd webhtv
          git checkout --detach "$SOURCE_COMMIT"
          git apply ../webhtv-android5.0.patch
          git apply ../chaquopy-disable.patch
          grep -q 'minSdk = "21"' gradle/libs.versions.toml
          grep -q '"api_level": 21' third_party/mpv-native-lock.json
          echo "Patches applied, minSdk=21, native lock api_level=21, Chaquopy disabled"

      - name: Rebuild MPV native stack (both ABIs)
        working-directory: webhtv
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          bash scripts/build_mpv_native.sh --abi all --install --jobs 4

      - name: Rebuild EXO-ASS native
        working-directory: webhtv
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          python3 scripts/build_exo_ass_native.py --install --jobs 4

      - name: Verify every .so is API 21
        working-directory: webhtv
        run: |
          python3 - <<'PY'
          import glob, struct, sys
          patterns = [
              "app/src/*/assets/mpv-libs/*/*.so",
              "app/src/main/jniLibs/*/*.so",
              "third_party/exo-ass-native/prebuilt/*/*.so",
          ]
          bad = []
          checked = 0
          for pattern in patterns:
              for path in glob.glob(pattern):
                  data = open(path, "rb").read()
                  idx = data.find(b"Android\0")
                  if idx < 0:
                      print("NO ANDROID NOTE:", path)
                      continue
                  api, _ndk = struct.unpack_from("<II", data, idx + 8)
                  checked += 1
                  print(f"{path}: api={api}")
                  if api > 21:
                      bad.append((path, api))
          print(f"Checked {checked} shared libraries")
          if bad:
              print("ERROR: libraries still above API 21:", bad, file=sys.stderr)
              sys.exit(1)
          PY

      - name: Pack rebuilt native assets
        run: |
          mkdir -p native-out
          cp -a webhtv/app/src/arm64_v8a/assets/mpv-libs native-out/mpv-arm64_v8a
          cp -a webhtv/app/src/armeabi_v7a/assets/mpv-libs native-out/mpv-armeabi_v7a
          cp -a webhtv/third_party/exo-ass-native/prebuilt native-out/exo-ass-prebuilt
          du -sh native-out/*

      - name: Upload rebuilt native assets
        uses: actions/upload-artifact@v4
        with:
          name: native-api21
          path: native-out/
          retention-days: 7

  build:
    name: Build ${{ matrix.variant }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant:
          - LeanbackArm64_v8a
          - LeanbackArmeabi_v7a

    steps:
      - name: Checkout build recipes
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platforms
        run: |
          sdkmanager "platform-tools" "platforms;android-28" "build-tools;36.0.0"
          curl -fsSL -o /tmp/platform-37.zip https://dl.google.com/android/repository/platform-37.0_r01.zip
          rm -rf /tmp/platform-37 "$ANDROID_HOME/platforms/android-37"
          mkdir -p /tmp/platform-37 "$ANDROID_HOME/platforms"
          unzip -q /tmp/platform-37.zip -d /tmp/platform-37
          platform_jar="$(find /tmp/platform-37 -name android.jar -print -quit)"
          test -n "$platform_jar"
          mv "$(dirname "$platform_jar")" "$ANDROID_HOME/platforms/android-37"

      - name: Clone upstream source and apply Android 5.0 patch
        run: |
          set -euo pipefail
          git clone "$SOURCE_REPO" webhtv
          cd webhtv
          git checkout --detach "$SOURCE_COMMIT"
          git apply ../webhtv-android5.0.patch
          git apply ../chaquopy-disable.patch
          grep -q 'minSdk = "21"' gradle/libs.versions.toml

      - name: Download rebuilt native assets
        uses: actions/download-artifact@v4
        with:
          name: native-api21
          path: native-in

      - name: Install rebuilt native assets
        run: |
          set -euo pipefail
          rm -rf webhtv/app/src/arm64_v8a/assets/mpv-libs
          rm -rf webhtv/app/src/armeabi_v7a/assets/mpv-libs
          rm -rf webhtv/third_party/exo-ass-native/prebuilt
          cp -a native-in/mpv-arm64_v8a webhtv/app/src/arm64_v8a/assets/mpv-libs
          cp -a native-in/mpv-armeabi_v7a webhtv/app/src/armeabi_v7a/assets/mpv-libs
          cp -a native-in/exo-ass-prebuilt webhtv/third_party/exo-ass-native/prebuilt

      - name: Verify bundled native assets
        working-directory: webhtv
        run: bash scripts/verify_mpv_native_assets.sh --require-elf

      - name: Assemble leanback release APK
        working-directory: webhtv
        run: |
          chmod +x gradlew
          ./gradlew ":app:assemble${{ matrix.variant }}Release" --no-daemon

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t apks < <(find webhtv/Release/apk -maxdepth 1 -name '*.apk')
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Expected exactly one APK, found ${#apks[@]}" >&2
            exit 1
          fi
          cp "${apks[0]}" dist/
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-native-${{ matrix.variant }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish full native rebuild release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          pattern: apk-native-*
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="android5-native-$(date +%Y%m%d%H%M)"
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          ls -lh dist/
          gh release create "$TAG" dist/*.apk dist/SHA256SUMS.txt \
            --title "WebHomeTV Android 5.0 Full Native Rebuild" \
            --notes "minSdk=21, leanback TV build, debug-signed. MPV and EXO-ASS native stacks rebuilt at API 21; every bundled .so verified <= API 21." \
            --prerelease
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_OUTPUT"
