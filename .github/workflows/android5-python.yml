name: WebHomeTV Android 5.0 - Python Spiders (Chaquopy 15)

# Restores Python-based site sources on API 21 by using the last Chaquopy line
# that officially supports minSdk 21 (15.0.1) together with AGP 8.5 / Gradle 8.7.
# Native .so files are the upstream API 24 binaries in this variant.

on:
  push:
    paths:
      - "webhtv-android5.0.patch"
      - ".github/workflows/android5-python.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  SOURCE_REPO: https://github.com/Silent1566/webhtv.git
  SOURCE_COMMIT: 3f469e2fe51716c2068a13b9d48f61de34a89e0d

jobs:
  build:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant:
          - LeanbackArm64_v8a
          - LeanbackArmeabi_v7a

    steps:
      - name: Checkout build recipes
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python 3.10 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platforms
        run: |
          sdkmanager "platform-tools" "platforms;android-28" "build-tools;36.0.0" "build-tools;35.0.0"
          curl -fsSL -o /tmp/platform-37.zip https://dl.google.com/android/repository/platform-37.0_r01.zip
          rm -rf /tmp/platform-37 "$ANDROID_HOME/platforms/android-37"
          mkdir -p /tmp/platform-37 "$ANDROID_HOME/platforms"
          unzip -q /tmp/platform-37.zip -d /tmp/platform-37
          platform_jar="$(find /tmp/platform-37 -name android.jar -print -quit)"
          test -n "$platform_jar"
          mv "$(dirname "$platform_jar")" "$ANDROID_HOME/platforms/android-37"

      - name: Clone upstream source and apply Android 5.0 patch
        run: |
          set -euo pipefail
          git clone "$SOURCE_REPO" webhtv
          cd webhtv
          git checkout --detach "$SOURCE_COMMIT"
          git apply ../webhtv-android5.0.patch
          grep -q 'minSdk = "21"' gradle/libs.versions.toml
          grep -q 'agp = "8.5.2"' gradle/libs.versions.toml
          grep -q 'python = "15.0.1"' gradle/libs.versions.toml
          grep -q 'id .com.chaquo.python.' chaquo/build.gradle
          test -f chaquo/src/main/python/app.py
          echo "Patches applied: minSdk=21, AGP 8.5.2, Chaquopy 15.0.1, Python spiders enabled"

      - name: Resolve dependencies and auto-override library minSdk
        working-directory: webhtv
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:dependencies --configuration leanbackArm64_v8aReleaseRuntimeClasspath --no-daemon > /tmp/deps.txt 2>&1 || true
          python3 ../scripts/auto_override_minsdk.py             app/src/main/AndroidManifest.xml             app/libs third_party/maven "$HOME/.gradle/caches/modules-2/files-2.1"

      - name: Verify bundled native assets
        working-directory: webhtv
        run: bash scripts/verify_mpv_native_assets.sh --require-elf

      - name: Assemble leanback release APK (auto-recover minSdk conflicts)
        working-directory: webhtv
        run: |
          set -uo pipefail
          chmod +x gradlew
          for attempt in $(seq 1 25); do
            echo "=== assemble attempt $attempt ==="
            if ./gradlew ":app:assemble${{ matrix.variant }}Release" --no-daemon 2>&1 | tee build.log; then
              echo "BUILD OK on attempt $attempt"
              exit 0
            fi
            pkg="$(grep -o 'tools:overrideLibrary="[^"]*"' build.log | tail -1 | sed -E 's/tools:overrideLibrary="([^"]*)"/\1/')"
            if [ -n "$pkg" ]; then
              echo "Adding missing override package: $pkg"
              python3 ../scripts/add_override_pkg.py app/src/main/AndroidManifest.xml "$pkg"
            else
              echo "No minSdk suggestion found; build failed for another reason"
              tail -60 build.log
              exit 1
            fi
          done
          echo "Exceeded 25 attempts resolving minSdk conflicts" >&2
          exit 1

      - name: Verify Python runtime is packaged
        working-directory: webhtv
        run: |
          set -euo pipefail
          apk=$(find Release/apk -maxdepth 1 -name '*.apk' | head -1)
          echo "APK: $apk"
          unzip -l "$apk" | grep -E 'assets/chaquopy/|lib/.*/libpython' | head -20
          unzip -l "$apk" | grep -q 'assets/chaquopy' || { echo "Chaquopy assets missing"; exit 1; }

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t apks < <(find webhtv/Release/apk -maxdepth 1 -name '*.apk')
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Expected exactly one APK, found ${#apks[@]}" >&2
            exit 1
          fi
          cp "${apks[0]}" dist/
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-python-${{ matrix.variant }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish Python-spider APK release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (for gh release)
        uses: actions/checkout@v4
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          pattern: apk-python-*
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="android5-python-$(date +%Y%m%d%H%M)"
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          ls -lh dist/
          gh release create "$TAG" dist/*.apk dist/SHA256SUMS.txt \
            --title "WebHomeTV Android 5.0 - Python spiders enabled" \
            --notes "minSdk=21, leanback TV build, debug-signed. Python site sources restored via Chaquopy 15.0.1 (AGP 8.5.2 / Gradle 8.7), the last official line supporting API 21. Native .so files are the upstream API 24 binaries in this variant." \
            --prerelease
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_OUTPUT"
